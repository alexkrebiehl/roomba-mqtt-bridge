[project]
name = "roomba-mqtt-bridge"
version = "0.1.0"
description = "Bridge an iRobot Roomba's local MQTT API to Home Assistant via MQTT discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "roombapy>=2.0.2,<3.0",
  "aiomqtt>=2.5,<3.0",
]

[project.scripts]
roomba-mqtt-bridge = "roomba_mqtt_bridge.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomba_mqtt_bridge"]
